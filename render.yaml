services:
  - type: web
    name: english-exam-prep-api
    runtime: node
    region: singapore
    branch: main
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @app/database db:generate && pnpm --filter @app/api build
    startCommand: pnpm --filter @app/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
