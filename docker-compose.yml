services:
  postgres:
    image: postgres:16-alpine
    container_name: exam_prep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam_prep
    ports:
      - "5433:5432"
    volumes:
      - exam_prep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam_prep"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  exam_prep_pg_data:
